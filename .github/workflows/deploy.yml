name: Deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/global_wallet_test?schema=public

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: global_wallet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d global_wallet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Apply migrations to CI database
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          JWT_SECRET: ci-test-secret-at-least-32-characters
          WEB_ORIGIN: http://localhost:3000
          NODE_ENV: test

      - name: Build
        run: npm run build

  migrate:
    name: Migrate Neon
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Prisma migrations to Neon
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    name: Deploy Firebase
    runs-on: ubuntu-latest
    needs: migrate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Functions Prisma schema for Firebase build
        run: mkdir -p functions/prisma && cp apps/api/prisma/schema.prisma functions/prisma/schema.prisma

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Configure Functions Secret Manager secrets
        run: |
          set -euo pipefail

          ensure_secret() {
            local name="$1"
            local value="$2"

            if [ -z "$value" ]; then
              printf '%s\n' "$name is required" >&2
              exit 1
            fi

            if ! gcloud secrets describe "$name" --project "$FIREBASE_PROJECT_ID" >/dev/null 2>&1; then
              gcloud secrets create "$name" --project "$FIREBASE_PROJECT_ID" --replication-policy="automatic" >/dev/null
            fi

            printf '%s' "$value" | gcloud secrets versions add "$name" --project "$FIREBASE_PROJECT_ID" --data-file=- >/dev/null
          }

          ensure_secret DATABASE_URL "$DATABASE_URL"
          ensure_secret JWT_SECRET "$JWT_SECRET"
          ensure_secret WEB_ORIGIN "$WEB_ORIGIN"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          WEB_ORIGIN: ${{ secrets.WEB_ORIGIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Generate Prisma Client
        run: npm run prisma:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Generate Functions Prisma Client
        run: npm --prefix functions run prisma:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build Functions bundle
        run: npm --prefix functions run build

      - name: Deploy Firebase Functions
        run: npx --yes firebase-tools deploy --project "${{ secrets.FIREBASE_PROJECT_ID }}" --only functions --force

      - name: Deploy Firebase App Hosting
        run: npx --yes firebase-tools deploy --project "${{ secrets.FIREBASE_PROJECT_ID }}" --only apphosting
