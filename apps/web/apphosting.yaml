# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_API_BASE_URL
    value: https://us-central1-global-wallet-ad32b.cloudfunctions.net/api
    availability:
      - BUILD
      - RUNTIME

